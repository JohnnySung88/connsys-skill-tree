[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "connsys-skill-tree"
version = "0.1.0"
description = "Local terminal skill tree for IC design teams"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
skill-tree = "skill_tree.cli:main"

[tool.setuptools.packages.find]
include = ["skill_tree*"]
